[package]
name = "alloy-op-evm"
description = "OP EVM implementation"

version = "0.32.0"
edition = "2021"
rust-version = "1.85"
authors = ["Alloy Contributors", "OpLabsPBC"]
license.workspace = true
homepage = "https://github.com/ethereum-optimism/optimism"
repository = "https://github.com/ethereum-optimism/optimism"

[lints]
workspace = true

[dependencies]
alloy-evm = { workspace = true }

alloy-eips = { workspace = true }
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true }

alloy-op-hardforks.workspace = true
op-alloy = { workspace = true, features = ["consensus"] }

# `optional_no_base_fee` exposes revm's `CfgEnv::disable_base_fee` flag, which `OpEvm::transact_raw`
# toggles to bypass base-fee validation for gasless transactions without mutating `block.basefee`.
# It is enabled directly here (not via workspace feature unification) so the flag is available in
# every build shape, including `--no-default-features`, the full OP node and the Kona/FPVM client.
revm = { workspace = true, features = ["optional_no_base_fee"] }
op-revm = { workspace = true }

thiserror = { workspace = true }

auto_impl = { workspace = true }

[dev-dependencies]
alloy-hardforks = { workspace = true }
test-case.workspace = true

[features]
default = ["std"]
std = [
	"alloy-primitives/std",
	"revm/std",
	"alloy-evm/std",
	"op-revm/std",
	"alloy-consensus/std",
	"alloy-eips/std",
	"op-alloy/std",
	"thiserror/std",
]
gmp = ["alloy-evm/gmp"]
engine = ["op-alloy/rpc-types-engine"]
rpc = ["alloy-evm/rpc", "op-alloy/rpc-types"]
asm-keccak = ["alloy-evm/asm-keccak", "alloy-primitives/asm-keccak", "revm/asm-keccak"]
arbitrary = [
	"alloy-consensus/arbitrary",
	"alloy-eips/arbitrary",
	"alloy-primitives/arbitrary",
	"op-alloy/arbitrary",
	"revm/arbitrary",
]
